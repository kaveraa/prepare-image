name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Permet de relancer la suite à la main sur une branche, depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-audit --no-fund

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Le vrai canevas d'un vrai navigateur : c'est la que se verifient le
  # decodage, la rotation, le redimensionnement et l'encodage.
  browser:
    name: Chromium
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - run: npm run test:browser

  # Contrôle unique exigé par la protection de la branche main :
  # il ne passe que si tous les autres jobs ont réussi.
  tests-passed:
    name: All tests passed
    needs: [tests, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success" && test "${{ needs.browser.result }}" = "success"
