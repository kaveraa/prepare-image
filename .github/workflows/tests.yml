name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run the suite by hand on a branch, from the Actions tab.
  workflow_dispatch:

jobs:
  tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-audit --no-fund

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The real canvas of a real browser: this is where decoding, rotation,
  # resizing and encoding are checked.
  browser:
    name: Chromium
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm install --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - run: npm run test:browser

  # Single check required by the protection of the main branch:
  # it passes only if all the other jobs succeeded.
  tests-passed:
    name: All tests passed
    needs: [tests, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success" && test "${{ needs.browser.result }}" = "success"
